# Flash layout for nice!nano v2 with the legacy Adafruit UF2 bootloader.
# Keep ZMK settings at its normal address (0xec000): this preserves existing
# BLE/split bonds when only the right half gains the Zigbee-capable NCS image.
softdevice:
  address: 0x00000
  end_address: 0x26000
  region: flash_primary
  size: 0x26000
app:
  address: 0x26000
  end_address: 0xe3000
  region: flash_primary
  size: 0xbd000
zboss_product_config:
  address: 0xe3000
  end_address: 0xe4000
  region: flash_primary
  size: 0x1000
zboss_nvram:
  address: 0xe4000
  end_address: 0xec000
  region: flash_primary
  size: 0x8000
settings_storage:
  address: 0xec000
  end_address: 0xf4000
  region: flash_primary
  size: 0x8000
legacy_uf2_bootloader:
  address: 0xf4000
  end_address: 0x100000
  region: flash_primary
  size: 0xc000

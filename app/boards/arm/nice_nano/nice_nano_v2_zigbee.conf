# Zigbee runtime profile shared by split keyboards built on nice!nano v2.
# It is passed only to the central/left image when CONFIG_ZMK_ZIGBEE=y.

# This remote joins the coordinator on the configured single Zigbee channel.
CONFIG_ZIGBEE_CHANNEL=11

# nice!nano v2 has no external 32 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_LF_ALWAYS_ON=y
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_MAX_SKIP=1
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_PERIOD=4000
CONFIG_CLOCK_CONTROL_NRF_CALIBRATION_TEMP_DIFF=2

# Keep BLE and ZBOSS scheduling bounded on the shared nRF52840 radio.
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT_OVERRIDE=y
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=3750
CONFIG_ZBOSS_DEFAULT_THREAD_PRIORITY=11
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_IPV6=n
CONFIG_NET_IP_ADDR_CHECK=n
CONFIG_NET_UDP=n
